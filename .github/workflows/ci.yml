name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Garder aligné avec la version de l'éditeur (voir docs/decisions/0001-moteur-godot-4.md).
  GODOT_VERSION: "4.5.1"

jobs:
  tests:
    name: Tests Godot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}

      - name: Importer le projet
        run: timeout 300 godot --headless --path game --import

      - name: Lancer les tests
        run: |
          set +e
          godot --headless --path game -s res://tests/run_tests.gd 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          {
            echo "### Résultats des tests"
            echo '```'
            grep -E "^(ok |ÉCHEC|SCRIPT ERROR)|test\(s\) réussi" test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "SCRIPT ERROR|Parse Error" test.log; then
            echo "::error::Erreurs de script détectées dans la sortie des tests"
            exit 1
          fi
          exit $status

  web:
    name: Export web
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          web-templates: "true"

      - name: Importer le projet
        run: timeout 300 godot --headless --path game --import

      - name: Exporter pour le web
        run: |
          mkdir -p build/web
          godot --headless --path game --export-release "Web" "$GITHUB_WORKSPACE/build/web/index.html"
          ls -la build/web
          test -f build/web/index.html && test -f build/web/index.pck && test -f build/web/index.wasm

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Publier sur GitHub Pages
    needs: web
    # Publie uniquement depuis la branche par défaut (pas pour les pull requests).
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer
        id: deployment
        uses: actions/deploy-pages@v4

  natif:
    name: Client natif (Windows, Linux)
    needs: tests
    # Publié depuis la branche par défaut seulement : release « client-natif » (GDD § 16.5).
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          desktop-templates: "true"

      - name: Importer le projet
        run: timeout 300 godot --headless --path game --import

      - name: Exporter
        run: |
          mkdir -p build/linux build/windows
          godot --headless --path game --export-release "Linux" "$GITHUB_WORKSPACE/build/linux/RetroVenture.x86_64"
          godot --headless --path game --export-release "Windows" "$GITHUB_WORKSPACE/build/windows/RetroVenture.exe"
          test -f build/linux/RetroVenture.x86_64 && test -f build/windows/RetroVenture.exe
          (cd build/linux && zip -q ../RetroVenture-linux.zip RetroVenture.x86_64)
          (cd build/windows && zip -q ../RetroVenture-windows.zip RetroVenture.exe)
          ls -la build

      - name: Publier sur GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^config\/version="\(.*\)"/\1/p' game/project.godot)
          title="Client natif $version (${GITHUB_SHA::7})"
          notes="Client natif Windows et Linux de Retro Venture, mis à jour à chaque push sur main (commit ${GITHUB_SHA::7}). Windows : dézipper puis lancer RetroVenture.exe (« Informations complémentaires » puis « Exécuter quand même » si Windows avertit). Linux : dézipper, puis chmod +x RetroVenture.x86_64."
          git tag -f client-natif "$GITHUB_SHA"
          git push -f origin client-natif
          gh release view client-natif >/dev/null 2>&1 \
            || gh release create client-natif --prerelease --title "$title" --notes "$notes" --verify-tag
          gh release upload client-natif build/RetroVenture-linux.zip build/RetroVenture-windows.zip --clobber
          gh release edit client-natif --title "$title" --notes "$notes" --prerelease

  serveur:
    name: Serveur de staging (image Docker)
    needs: tests
    # L'image « staging » suit main : le serveur de test la reprend à chaque lancement (serveur/README.md).
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Construire et publier
        run: |
          image=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/retro-venture-serveur
          docker build -f serveur/Dockerfile -t "$image:staging" -t "$image:${GITHUB_SHA::7}" .
          # Le serveur démarre et écoute (serveur de développement, sans Supabase).
          docker run -d --name essai -p 8080:8080 "$image:staging"
          for i in $(seq 1 30); do
            docker logs essai 2>&1 | grep -q "à l'écoute" && break
            sleep 1
          done
          docker logs essai
          docker logs essai 2>&1 | grep -q "à l'écoute"
          docker rm -f essai
          docker push "$image:staging"
          docker push "$image:${GITHUB_SHA::7}"
